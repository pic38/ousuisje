<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="pages.about.title">À propos — OuSuisJe</title>
<meta name="theme-color" content="#0B1220" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
<script src="i18n/i18n.js"></script>
</head>
<body>
<div class="page">
  <div class="page-header-row">
    <a class="back" href="index.html" data-i18n="pages.backLink">← Retour à OuSuisJe</a>
    <div class="lang-switcher">
      <label class="settings-lang-label" for="languageSelect" data-i18n="settings.langLabel">Langue</label>
      <div class="lang-select-wrap">
        <select id="languageSelect" class="lang-select">
          <option value="fr" data-i18n="settings.langFr">Français</option>
          <option value="en" data-i18n="settings.langEn">English</option>
        </select>
      </div>
    </div>
  </div>

  <div id="translationNotice" class="translation-notice is-hidden"></div>

  <div id="pageContent">
    <h1>À propos</h1>
    <p class="page-sub">Ce que fait cette application, et ce qu'elle ne fait pas.</p>
  </div>

  <p style="margin-top:32px;"><a class="back" href="index.html" data-i18n="pages.backLink">← Retour à OuSuisJe</a></p>
</div>

<script>
(function () {
  var pageContent = document.getElementById('pageContent');
  var languageSelect = document.getElementById('languageSelect');

  function loadFragment(lang) {
    return fetch('i18n/pages/about/' + lang + '.html')
      .then(function (res) { if (!res.ok) throw new Error('missing fragment'); return res.text(); })
      .then(function (html) { pageContent.innerHTML = html; })
      .catch(function () {
        if (lang !== 'en') {
          return fetch('i18n/pages/about/en.html')
            .then(function (res) { return res.text(); })
            .then(function (html) { pageContent.innerHTML = html; });
        }
      });
  }

  // Hidden crash-log trigger for the Android app build: long-press the page's <h1>.
  // Delegated on the stable #pageContent container since its content (including the <h1>)
  // is fragment-injected per language by loadFragment() above — this way the gesture keeps
  // working no matter which of the 26 language fragments is currently loaded, with no
  // per-language wiring needed. window.CrashBridge only exists inside the Android WebView
  // (see MainActivity.kt), so this is a silent no-op on the plain website.
  var longPressTimer = null;
  function startLongPress(e) {
    if (!e.target.closest('h1')) return;
    longPressTimer = setTimeout(function () {
      longPressTimer = null;
      if (window.CrashBridge && window.CrashBridge.showCrashLog) {
        window.CrashBridge.showCrashLog();
      }
    }, 2000);
  }
  function cancelLongPress() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  }
  pageContent.addEventListener('pointerdown', startLongPress);
  pageContent.addEventListener('pointerup', cancelLongPress);
  pageContent.addEventListener('pointercancel', cancelLongPress);
  pageContent.addEventListener('pointerleave', cancelLongPress);

  I18N.ready.then(function () {
    languageSelect.value = I18N.lang();
    loadFragment(I18N.lang());
  });

  languageSelect.addEventListener('change', function () { I18N.setLang(languageSelect.value); });
  window.addEventListener('i18n:changed', function (e) {
    languageSelect.value = e.detail.lang;
    loadFragment(e.detail.lang);
  });
})();
</script>
</body>
</html>
