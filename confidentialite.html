<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title data-i18n="pages.privacy.title">Confidentialité — OuSuisJe</title>
<meta name="theme-color" content="#0B1220" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
<script src="i18n/i18n.js"></script>
</head>
<body>
<div class="page">
  <a class="back" href="/" data-i18n="pages.backLink">← Retour à OuSuisJe</a>

  <div class="lang-switcher">
    <label class="settings-lang-label" for="languageSelect" data-i18n="settings.langLabel">Langue</label>
    <select id="languageSelect" class="settings-bulk-btn">
      <option value="fr" data-i18n="settings.langFr">Français</option>
      <option value="en" data-i18n="settings.langEn">English</option>
    </select>
  </div>

  <div id="translationNotice" class="translation-notice is-hidden"></div>

  <div id="pageContent">
    <h1>Confidentialité</h1>
    <p class="page-sub">Ce qui est envoyé, à qui, et dans quel cas.</p>
  </div>

  <p style="margin-top:32px;"><a class="back" href="/" data-i18n="pages.backLink">← Retour à OuSuisJe</a></p>
</div>

<script>
(function () {
  var pageContent = document.getElementById('pageContent');
  var languageSelect = document.getElementById('languageSelect');

  function loadFragment(lang) {
    return fetch('i18n/pages/privacy/' + lang + '.html')
      .then(function (res) { if (!res.ok) throw new Error('missing fragment'); return res.text(); })
      .then(function (html) { pageContent.innerHTML = html; })
      .catch(function () {
        if (lang !== 'en') {
          return fetch('i18n/pages/privacy/en.html')
            .then(function (res) { return res.text(); })
            .then(function (html) { pageContent.innerHTML = html; });
        }
      });
  }

  I18N.ready.then(function () {
    languageSelect.value = I18N.lang();
    loadFragment(I18N.lang());
  });

  languageSelect.addEventListener('change', function () { I18N.setLang(languageSelect.value); });
  window.addEventListener('i18n:changed', function (e) {
    languageSelect.value = e.detail.lang;
    loadFragment(e.detail.lang);
  });
})();
</script>
</body>
</html>
